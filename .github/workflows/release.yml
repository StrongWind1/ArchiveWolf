name: Release

run-name: Release -- ${{ github.ref_name }}

"on":
  push:
    tags: [v*]

# A release run is never cancelled: a second run for the same tag waits for the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BIN: archivewolf

permissions:
  contents: read

# No job restores a cache: every binary is built from the tagged source and Cargo.lock alone.

jobs:
  # No artifact is built from a tag whose tests fail: every build job needs this one.
  # It uploads nothing, because the publish job releases every artifact of the run.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup show

      # The tools the tests compare with, as in ci.yml: the same builds and hashes.
      - name: Install 7-Zip and UnRAR
        env:
          SEVENZIP_URL: https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-x64.tar.xz
          SEVENZIP_SHA256: 2b539cf067b2ad48e1baa5093dbaa8818b73542d1222a0ffde9dc5f2922ea62e
          UNRAR_URL: https://www.rarlab.com/rar/rarlinux-x64-723.tar.gz
          UNRAR_SHA256: 759b4b6aa0d9f77131882162951193f3a0e54bf60e1d8dc4255aa308accab588
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/archive-tools"
          mkdir -p "${tools}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/7z.tar.xz" "${SEVENZIP_URL}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/rar.tar.gz" "${UNRAR_URL}"
          echo "${SEVENZIP_SHA256}  ${RUNNER_TEMP}/7z.tar.xz" | sha256sum --check --strict
          echo "${UNRAR_SHA256}  ${RUNNER_TEMP}/rar.tar.gz" | sha256sum --check --strict
          tar -xf "${RUNNER_TEMP}/7z.tar.xz" -C "${tools}" 7zz
          tar -xzf "${RUNNER_TEMP}/rar.tar.gz" -C "${tools}" --strip-components=1 rar/unrar
          echo "${tools}" >> "${GITHUB_PATH}"

      # The build nextest publishes, checked against its hash. The same pin is in ci.yml.
      - name: Install cargo-nextest
        env:
          NEXTEST_URL: https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.151/cargo-nextest-0.9.151-x86_64-unknown-linux-gnu.tar.gz
          NEXTEST_SHA256: 1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/nextest"
          mkdir -p "${tools}"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/nextest.tar.gz" "${NEXTEST_URL}"
          echo "${NEXTEST_SHA256}  ${RUNNER_TEMP}/nextest.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/nextest.tar.gz" -C "${tools}" cargo-nextest
          echo "${tools}" >> "${GITHUB_PATH}"

      - name: cargo nextest run
        run: |
          set -euo pipefail
          cargo nextest run --locked --profile ci --all-targets

  build-linux-x86:
    name: Build (Linux x86_64)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup show

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build release binary
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/x86_64-unknown-linux-musl/release/${BIN}" "dist/${BIN}-linux-x86_64"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-x86-binaries
          path: dist/${{ env.BIN }}-linux-x86_64*
          if-no-files-found: error

  build-linux-arm:
    name: Build (Linux arm64)
    needs: [test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup show

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build release binary
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-musl
          cargo build --locked --release --target aarch64-unknown-linux-musl

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/aarch64-unknown-linux-musl/release/${BIN}" "dist/${BIN}-linux-arm64"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-arm-binaries
          path: dist/${{ env.BIN }}-linux-arm64*
          if-no-files-found: error

  build-windows:
    name: Build (Windows ${{ matrix.label }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64-msvc.exe
          - label: x86_64-gnu
            runner: ubuntu-latest
            target: x86_64-pc-windows-gnu
            artifact: windows-x86_64-gnu.exe
            mingw_pkg: gcc-mingw-w64-x86-64
          - label: arm64-msvc
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64-msvc.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ARTIFACT: ${{ matrix.artifact }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup show

      - name: Add cross-compilation target
        run: |
          set -euo pipefail
          rustup target add "${BUILD_TARGET}"

      - name: Fix apt mirror priorities
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:2/priority:0/' /etc/apt/apt-mirrors.txt
            sudo sed -i '/azure.archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:0/priority:1/' /etc/apt/apt-mirrors.txt
            sudo sed -i '/security.ubuntu.com\/ubuntu\/\tpriority/ s/priority:3/priority:2/' /etc/apt/apt-mirrors.txt
          fi

      - name: Install MinGW cross-linker (GNU build only)
        if: matrix.mingw_pkg != ''
        env:
          MINGW_PKG: ${{ matrix.mingw_pkg }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends "${MINGW_PKG}"

      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${BUILD_TARGET}"

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${BUILD_TARGET}/release/${BIN}.exe" "dist/${BIN}-${BUILD_ARTIFACT}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-${{ matrix.label }}-binary
          path: dist/${{ env.BIN }}-${{ matrix.artifact }}
          if-no-files-found: error

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup show

      - name: Add cross-compilation target
        run: |
          set -euo pipefail
          rustup target add "${BUILD_TARGET}"

      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${BUILD_TARGET}"

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${BUILD_TARGET}/release/${BIN}" "dist/${BIN}-macos-${BUILD_ARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-binary
          path: dist/${{ env.BIN }}-macos-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build-linux-x86, build-linux-arm, build-windows, build-macos]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write  # create the draft release and upload its files
      id-token: write  # the OIDC token that cosign and the attestation sign with
      attestations: write  # store the build provenance attestation
    steps:
      - name: Download every build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          merge-multiple: true
          path: dist/

      - name: Create macOS universal binary
        run: |
          set -euo pipefail
          lipo -create \
            -output "dist/${BIN}-macos-universal" \
            "dist/${BIN}-macos-arm64" \
            "dist/${BIN}-macos-x86_64"
          lipo -info "dist/${BIN}-macos-universal"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f -not -name SHA256SUMS -exec basename {} \; | sort | xargs shasum -a 256 -b > /tmp/sha256sums
          mv /tmp/sha256sums SHA256SUMS
          cat SHA256SUMS

      # This job holds the token that signs and the permission to release, so the cosign
      # binary is run only after it matches the hash in cosign_checksums.txt of its release.
      - name: Install cosign
        env:
          COSIGN_URL: https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-darwin-arm64
          COSIGN_SHA256: 9f9b8cd557cf2e5b3df3373a00baa005a86b02391e3e06dd0ce37b3a1533d3a4
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/cosign"
          mkdir -p "${tools}"
          curl -fsSL --retry 3 -o "${tools}/cosign" "${COSIGN_URL}"
          echo "${COSIGN_SHA256}  ${tools}/cosign" | shasum -a 256 --check
          chmod +x "${tools}/cosign"
          echo "${tools}" >> "${GITHUB_PATH}"
          "${tools}/cosign" version

      # The bundle holds the signature, the certificate and the proof that the signing was
      # logged: all that `cosign verify-blob --bundle` needs besides SHA256SUMS itself.
      - name: Sign SHA256SUMS (cosign keyless)
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # What a user runs, with the identity of this workflow at this tag. A bundle that
      # does not verify here is never released.
      - name: Verify the signature
        run: |
          set -euo pipefail
          cd dist
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Generate SLSA build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/${{ env.BIN }}-*

      - name: List release artifacts
        run: |
          set -euo pipefail
          ls -lh dist/

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Creating draft release ${TAG}"
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --draft \
            dist/*
